name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No Omarchy install available on a generic runner to run the real
      # `omarchy plugin validate`, so this mirrors its core checks
      # (schemaVersion, required fields, entry point exists, no symlinks)
      # directly against manifest.json.
      - name: Validate manifest.json
        run: |
          set -euo pipefail
          jq -e . manifest.json > /dev/null || { echo "manifest.json is not valid JSON"; exit 1; }
          jq -e '.schemaVersion == 1' manifest.json > /dev/null || { echo "schemaVersion must be 1"; exit 1; }
          for field in id name version kinds entryPoints; do
            jq -e --arg f "$field" 'has($f)' manifest.json > /dev/null \
              || { echo "manifest missing required field '$field'"; exit 1; }
          done
          entry=$(jq -r '.entryPoints.barWidget // empty' manifest.json)
          [[ -n $entry ]] || { echo "missing entryPoints.barWidget"; exit 1; }
          [[ -f $entry ]] || { echo "entry point '$entry' does not exist"; exit 1; }
          echo "manifest.json OK"

      - name: No symlinks in the plugin folder
        run: |
          set -euo pipefail
          link=$(find . -name .git -prune -o -type l -print -quit)
          [[ -z $link ]] || { echo "symlinks are not allowed in a plugin folder: $link"; exit 1; }
          echo "no symlinks found"
